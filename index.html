<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HappyGo</title>
</head>

<body>

<script>

    const LAN_URL = "http://192.168.2.141:65535";
    const PUBLIC_URL = "https://6cfade9e.r20.vip.cpolar.cn";

    const timeout = 1200;

    function check(url) {
        return new Promise(resolve => {

            const img = new Image();
            let done = false;

            const finish = result => {
                if (done) return;

                done = true;
                clearTimeout(timer);
                resolve(result);
            };

            const timer = setTimeout(() => {
                finish(false);
            }, timeout);

            img.onload = () => finish(true);

            img.onerror = () => finish(true);

            img.src = url + "/favicon.ico?_=" + Date.now();
        });
    }

    async function start() {

        // 优先检查内网
        if (await check(LAN_URL)) {
            window.location.replace(LAN_URL);
            return;
        }

        // 内网不存在，走公网
        window.location.replace(PUBLIC_URL);
    }

    start();

</script>

</body>
</html>
